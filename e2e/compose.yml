# End-to-end test stack: the gateway image built from this repository, the
# real guard snippets from deploy/auth.caddy, the production Caddy and a
# header-echo app. Run it with scripts/e2e.sh, not directly.
#
# The gateway uses the log mail backend so the test can read each code from
# its log, which the gateway allows only in its insecure-cookie mode. That mode
# drops the cookie's Secure attribute and the HSTS header and changes nothing
# else; both are covered by unit tests (TestHSTSHeaderOnlyUnderTLS and the
# session package's cookie tests).
services:
  caddy:
    # The digest the department server's scaffold pins (vps-base-template
    # docker/caddy.base.yml), so the test runs the Caddy production runs.
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    environment:
      - DOMAIN=e2e.test
    ports:
      - "127.0.0.1:${E2E_PORT:-18443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The guard snippets under test. A server repo can point this at its own
      # apps/auth/auth.caddy to test its diverged copy.
      - ${E2E_AUTH_CADDY:-../deploy/auth.caddy}:/etc/caddy/auth.caddy:ro
    depends_on:
      auth:
        condition: service_healthy
      whoami:
        condition: service_started

  auth:
    build:
      context: ..
    # The same runtime restrictions as deploy/docker-compose.yml, so a change
    # that needs a capability or a writable root fails here first.
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - auth_data:/data
    mem_limit: 128m
    pids_limit: 128
    environment:
      - DOMAIN=e2e.test
      - AUTH_PUBLIC_URL=https://auth.e2e.test
      - ALLOWED_EMAIL_DOMAINS=example.org,example.net
      - ADMIN_EMAILS=boss@admins.example
      - OPEN_REGISTRATION_HOSTS=open.e2e.test
      - SESSION_SECRET=${E2E_SESSION_SECRET:?set by scripts/e2e.sh}
      - DATA_ENCRYPTION_KEY=${E2E_DATA_KEY:?set by scripts/e2e.sh}
      - EMAIL_BACKEND=log
      - EMAIL_FROM=Sign-in <auth@e2e.test>
      - COOKIE_INSECURE=true
      - TOTP_ENABLED=true
      - PASSKEYS_ENABLED=true
      - OTP_LENGTH=8
      # Short renewal so the test can watch a session renew.
      - SESSION_TTL=10m
      - SESSION_RENEW_AFTER=3s
      - SESSION_REMEMBER_TTL=1h
      # Code requests per client IP; the last test spends the rest of it.
      - RATELIMIT_PER_IP=40/15m
      # One app reads group members over its own network, as on the servers.
      - MEMBER_READERS=reader=staff
      - MEMBER_READER_TOKEN_READER=e2e-reader-token-0123456789abcdefghij
    networks:
      default:
      reader_members:
        # The name the gateway has on each members network; the members
        # listener binds only to the addresses it names, and the public
        # listener refuses connections arriving on them.
        aliases: [auth-members]
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 20

  whoami:
    # Echoes every request header back, so the test sees what the app sees.
    image: traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44

  reader:
    # An app that reads group members, on its members network only. It is
    # the Caddy image only because that image is pinned already and has wget.
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    command: ["sleep", "3600"]
    networks: [reader_members]

networks:
  default:
  reader_members:
    internal: true

volumes:
  auth_data:
