{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{template "title" .}} · Admin</title>
<style>
  /* Palette. Every colour is a custom property here; the dark-mode block
     re-points the same names, so individual rules never hardcode a hex value
     or carry their own @media override. Grouped by role. */
  :root {
    color-scheme: light dark;
    --accent: #2563eb;        /* links / primary action */
    --accent-hover: #1d4ed8;
    --bg: #f6f7f9;            /* page background */
    --surface: #fff;         /* panels */
    --card-border: transparent;
    --text: #1c1e21;
    --muted: #65676b;        /* secondary text */
    --line: #e7e9ec;         /* table rules */
    --input-bg: #fff;
    --input-border: #ccd0d5;
    /* Top bar */
    --bar-bg: #1f2937;
    --bar-fg: #fff;
    --bar-link: #cbd5e1;
    /* Secondary buttons */
    --danger: #b91c1c;
    --danger-hover: #991b1b;
    --ghost-bg: #e5e7eb;
    --ghost-fg: #1f2937;
    --ghost-hover: #d1d5db;
    /* Status pills */
    --ok-bg: #dcfce7;
    --ok-fg: #166534;
    --off-bg: #fee2e2;
    --off-fg: #991b1b;
    /* Errors */
    --err-bg: #fde8e8;
    --err-text: #9b1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --surface: #1f2228;
      --card-border: #2c2f36;
      --text: #e7e9ea;
      --muted: #9aa0a6;
      --line: #2c2f36;
      --input-bg: #14161a;
      --input-border: #3a3d44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header.bar {
    background: var(--bar-bg); color: var(--bar-fg); padding: 14px 24px; display: flex; align-items: center; gap: 20px;
  }
  header.bar strong { font-size: 16px; }
  header.bar nav a { color: var(--bar-link); text-decoration: none; font-size: 14px; margin-right: 14px; }
  header.bar nav a:hover { color: var(--bar-fg); }
  main { max-width: 920px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .panel {
    background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 20px;
    border: 1px solid var(--card-border);
    box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 6px 18px rgba(0,0,0,.05);
  }
  /* On the dark page the drop shadow disappears; the border (transparent in
     light mode) separates the panel instead. */
  @media (prefers-color-scheme: dark) { .panel { box-shadow: none; } }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=email], input[type=url], input[type=number], textarea, select {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--input-border); border-radius: 9px;
    background: var(--input-bg); color: inherit; font-family: inherit;
  }
  textarea { resize: vertical; line-height: 1.5; }
  input[type=file] { font-size: 14px; }
  input[type=color] { width: 56px; height: 40px; padding: 2px; border: 1px solid var(--input-border); border-radius: 9px; background: var(--input-bg); cursor: pointer; }
  .swatch { flex: 0 0 auto; }
  .swatch label { margin-top: 0; }
  label.ck { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 6px 0; cursor: pointer; }
  label.ck input { width: auto; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 200px; }
  button {
    margin-top: 14px; padding: 10px 16px; font-size: 14px; font-weight: 600; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-hover); }
  button.ghost { background: var(--ghost-bg); color: var(--ghost-fg); }
  button.ghost:hover { background: var(--ghost-hover); }
  .inline { display: inline; }
  .inline button { margin-top: 0; padding: 6px 12px; font-size: 13px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .pill.off { background: var(--off-bg); color: var(--off-fg); }
  .pill.guest { background: var(--ghost-bg); color: var(--ghost-fg); }
  .qrbox { text-align: center; }
  .qrbox img { width: 240px; height: 240px; image-rendering: pixelated; background: #fff; padding: 12px; border-radius: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { background: var(--err-bg); color: var(--err-text); border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; }
  code.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  /* Shell: brand, menu with the current page marked, signed-in admin. The menu
     scrolls sideways on a narrow screen instead of wrapping into rows. */
  header.bar { flex-wrap: wrap; row-gap: 8px; }
  header.bar nav { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; -webkit-overflow-scrolling: touch; }
  header.bar nav a { margin: 0; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  header.bar nav a[aria-current=page] { background: rgba(255,255,255,.12); color: var(--bar-fg); }
  header.bar .who { font-size: 13px; color: var(--bar-link); white-space: nowrap; display: flex; gap: 12px; align-items: center; }
  header.bar .who a { color: var(--bar-fg); text-decoration: none; }
  header.bar .who a:hover { text-decoration: underline; }
  @media (max-width: 640px) {
    header.bar { padding: 12px 16px; }
    header.bar nav { order: 3; flex-basis: 100%; }
    main { padding: 20px 16px 48px; }
  }
  /* One-line confirmation or refusal after an action. */
  .notice { border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: 14px; }
  .notice.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .notice.warn { background: var(--err-bg); color: var(--err-text); }
  /* Disclosure rows: a group, a missing group, a confirmation step. */
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "\25B8"; display: inline-block; width: 1em; color: var(--muted); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  .grouprow { border-top: 1px solid var(--line); padding: 12px 0; }
  .grouprow:first-child { border-top: 0; padding-top: 0; }
  .grouprow > summary { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .grouprow > summary .name { font-weight: 600; }
  .grouprow > summary .meta { color: var(--muted); font-size: 13px; }
  .grouprow > summary .count { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .grouprow .body { padding: 10px 0 4px 1em; }
  .inlineform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .inlineform input[type=text], .inlineform input[type=email] { flex: 1 1 220px; width: auto; padding: 8px 10px; font-size: 14px; }
  .inlineform button { margin-top: 0; padding: 8px 14px; }
  .inlineform select { flex: 1 1 220px; width: auto; padding: 8px 10px; font-size: 14px; }
  .confirm { margin-top: 14px; }
  .confirm > summary { color: var(--danger); font-size: 14px; font-weight: 600; display: inline-block; }
  .confirm > summary::before { content: none; }
  .confirm .confirmbody { margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .confirm .confirmbody p { margin: 0 0 10px; font-size: 14px; }
  .confirm .confirmbody button { margin-top: 0; }
  /* Overview tiles. */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.07); text-decoration: none; color: inherit; display: block; }
  .stat:hover { text-decoration: none; border-color: var(--accent); }
  .stat .n { font-size: 26px; font-weight: 700; display: block; }
  .stat .l { color: var(--muted); font-size: 13px; }
  ul.todo { margin: 0; padding-left: 18px; }
  ul.todo li { margin: 6px 0; }
  .tablewrap { overflow-x: auto; }
  .missingrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 0; }
  .missingrow .what { flex: 1 1 260px; }
  .missingrow .inlineform { margin-top: 0; flex: 0 1 340px; }
  .missingrow .inlineform input[type=text] { flex: 1 1 160px; }
</style>
</head>
<body>
  <header class="bar">
    <strong>Auth admin</strong>
    <nav aria-label="Admin pages">
      <a href="/admin/"{{if eq .Active "admin_home"}} aria-current="page"{{end}}>Overview</a>
      <a href="/admin/groups"{{if eq .Active "admin_groups"}} aria-current="page"{{end}}>Groups</a>
      <a href="/admin/break"{{if or (eq .Active "admin_codes") (eq .Active "admin_code_detail")}} aria-current="page"{{end}}>Break-glass codes</a>
      <a href="/admin/access"{{if eq .Active "admin_access"}} aria-current="page"{{end}}>Access log</a>
      <a href="/admin/audit"{{if eq .Active "admin_audit"}} aria-current="page"{{end}}>Admin audit</a>
      <a href="/admin/totp"{{if eq .Active "admin_totp"}} aria-current="page"{{end}}>Admin 2FA</a>
      <a href="/admin/branding"{{if eq .Active "admin_branding"}} aria-current="page"{{end}}>Branding</a>
      <a href="/admin/settings"{{if eq .Active "admin_settings"}} aria-current="page"{{end}}>Settings</a>
    </nav>
    {{if .AdminEmail}}<span class="who">{{.AdminEmail}} <a href="/logout">Sign out</a></span>{{end}}
  </header>
  <main>
    {{if .Notice}}<div class="notice ok" role="status">{{.Notice}}</div>{{end}}
    {{if .Warning}}<div class="notice warn" role="alert">{{.Warning}}</div>{{end}}
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
