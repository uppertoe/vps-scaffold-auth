# Reference wiring for running vps-scaffold-auth as an app in a server repo
# created from server-instance-template. Copy this directory's files to
# apps/auth/ in your server repo (the template already ships them), then add
#
#   include:
#     - apps/auth/docker-compose.yml
#
# to the server's root docker-compose.yml.
services:
  auth:
    # Released tag pinned by digest; Renovate bumps it. The image is distroless
    # and already runs as the nonroot user (65532). See scaffold/docs/08-security-model.md.
    image: ghcr.io/uppertoe/vps-scaffold-auth:v0.1.0@sha256:dc9b3bd46b5fbc0a0087b5312ed626d496eff27cb4f6531473dc6e2b5564ca2f
    restart: unless-stopped
    # CIS Docker §5 runtime hardening. The auth binary needs no extra capabilities
    # and binds only an internal port (:8080) behind Caddy.
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./.env
        required: false # keep `docker compose config` valid in CI without a real .env
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - auth_data:/data
    # This sample joins one shared "caddy" network to stay short. On the
    # scaffold's servers it is not the layout: the gateway shares auth_proxy with
    # Caddy, and each app sits on its own <app>_proxy network that only Caddy
    # joins. The scaffold's compose audit refuses a network shared by two apps,
    # and apps publish no ports. An app trusts the Remote-* headers only because
    # nothing but Caddy can reach it, so never put apps on one network together.
    networks:
      - caddy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # NOTE: no published ports — only Caddy may reach the gateway. Never expose
    # this service's /verify (or a protected app) directly to the internet.
    #
    # The members endpoint (MEMBER_READERS, port 8081) is never published and
    # never reached over the caddy network either. An app that reads group
    # members joins the gateway on a network of its own, which only the two of
    # them share; the scaffold's route renderer generates it, as below, from a
    # "# scaffold-members:" marker in the app's Caddy snippet:
    #
    #   networks:
    #     - caddy
    #     - teaching-cases_members
    #
    #   networks:
    #     teaching-cases_members:
    #       internal: true

volumes:
  auth_data:

networks:
  caddy:
    external: true
    name: caddy
